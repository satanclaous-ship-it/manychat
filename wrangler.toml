# auto-dm — Cloudflare Workers 설정
# 설계서 §1 (아키텍처) · §9 (레포 구조)
name = "auto-dm"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# 시퀀스 잡 발송 + 주 1회 토큰 갱신 (설계서 §6)
[triggers]
crons = ["* * * * *"]

# D1 — 연락처·메시지·자동화·시퀀스·이벤트로그·설정 (설계서 §2)
# database_id는 이 계정의 auto_dm_db (2026-07 배포 시 생성). 시크릿 아님(계정 인증으로 보호).
# 다른 계정에 새로 배포하면 `wrangler d1 create auto_dm_db` 후 이 값을 교체.
[[d1_databases]]
binding = "DB"
database_name = "auto_dm_db"
database_id = "b60fc9ac-2395-4745-b534-aa70c38230f9"

# 시크릿은 코드/레포에 두지 않는다 (설계서 §8) — wrangler secret put 로 주입:
#   APP_SECRET            Meta 앱 시크릿 (웹훅 서명 검증)
#   WEBHOOK_VERIFY_TOKEN  웹훅 등록 검증 토큰
#   DASHBOARD_PASSWORD    대시보드 로그인 비밀번호
#   SESSION_SIGNING_KEY   세션 쿠키 서명 키
